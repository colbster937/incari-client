# The singleplayer benchmark's baseline (ADR 0039; ./gradlew :app-web:benchmark -Pbenchmark.singleplayer,
# singleplayer.txt): as baseline.properties, for the scenarios a world the page runs itself plays.
# Kept apart from the server benchmark's: recording one machine's figures replaces all of them.
#
# rule.<figure>=<higher|lower is better> <percent> <absolute>

# Frame rate and frame time.
rule.fpsMedian=higher 5 1
rule.fpsLow1=higher 15 3
rule.frameP99Millis=lower 15 2
# Where the frame's time goes (milliseconds a frame).
rule.tickMillis=lower 20 0.5
rule.extractMillis=lower 20 0.5
rule.renderMillis=lower 20 0.5
rule.gpuMillis=lower 20 0.5
# Memory, in megabytes, and garbage collection pauses: the page's, then the server worker's.
rule.heapMaxMB=lower 10 16
rule.nativeMaxMB=lower 10 16
rule.gcMaxPauseMillis=lower 30 4
rule.workerHeapLiveMB=lower 10 16
# The server worker's ticks: 20 a second when it keeps up.
rule.serverTicksPerSecond=higher 5 1
rule.serverTickMillis=lower 20 2
rule.serverTickP95Millis=lower 20 5
# Loading, in milliseconds: the world created from the title screen, Save and Quit until it's
# stored, and opening it again from a reload (from the navigation).
rule.coldTitleMillis=lower 20 500
rule.createMillis=lower 20 1000
rule.saveQuitMillis=lower 20 500
rule.openMillis=lower 20 1000
rule.gzipBytes=lower 2 10000




