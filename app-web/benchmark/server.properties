# The benchmark's game server (see benchmark.txt). The runner adds the address, ports and a
# random RCON password, and starts every run with a fresh world from this seed. Command blocks
# move the fly-through's camera, a step each tick.
level-seed=20260928
level-type=minecraft\:normal
generate-structures=true
online-mode=false
white-list=false
difficulty=easy
spawn-monsters=false
view-distance=8
simulation-distance=6
spawn-protection=0
enable-command-block=true
pause-when-empty-seconds=0
max-tick-time=-1
broadcast-console-to-ops=false
broadcast-rcon-to-ops=false
sync-chunk-writes=false
enable-status=true
