# The budgets, set for memory (ADR 0025) and start-up (ADR 0026): absolute limits the
# benchmark (tools/webbuild's PerfBudget) fails a figure over, whatever the baseline says. Figures are
# as report.json names them; a * stands for one part of the name (a scenario). Measured on the
# release build (-Pteavm.release), which is what players get.
#
#   max.<figure>=<limit>             for every machine: memory (the same build in the same scene keeps
#                                    the same heap wherever it runs)
#   <machine>.max.<figure>=<limit>   for one machine: times, which are the machine's speed
#
# Raising a limit is fine when the pull request says why; the point is that growth is noticed.

# Memory, in megabytes. The live figures are what the page still holds after a full collection
# (the game's own memory, not garbage the browser hasn't collected yet). Set from the release build
# of 2026-10-01 (title screen 262 MB live; in the world 337 to 351 MB live, 45 to 53 MB of linear
# memory in use, 75 MB of it at its largest) with about a fifth of headroom.
max.load.titleHeapLiveMB=320
max.*.heapLiveMB=420
# Linear memory never shrinks: its largest is what the page keeps for good.
max.*.nativeMaxMB=128

# The memory gate: no garbage collection pause above 16 ms (a frame at 60 fps).
max.*.gcMaxPauseMillis=16

# Start-up, in milliseconds from the navigation (the gate: the warm start to the title screen).
# The development desktop (Ryzen 5 9600X): 2.2 s warm and 3.2 s cold measured on 2026-10-01.
desktop.max.load.warmTitleMillis=3000
desktop.max.load.coldTitleMillis=4500
# The floor device, a 4 GB Chromebook (docs/benchmark.md): targets, not measurements, until the
# device is measured. Its CPU (Celeron N4500 class) is estimated at about a fifth of the desktop's
# single-thread speed, which puts the desktop's 2.2 s warm start near 10 s there.
chromebook-4gb.max.load.warmTitleMillis=10000
chromebook-4gb.max.load.coldTitleMillis=20000
