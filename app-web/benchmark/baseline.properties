# The benchmark's baseline (ADR 0021; tools/webbuild's PerfBaseline). ./gradlew
# :app-web:benchmark fails when a figure is worse than this machine's recorded one by more than
# its rule allows: both more than the percentage and more than the absolute amount, so noise in a
# small figure doesn't fail a run. Figures without a rule are recorded but never fail.
#
# Re-record a machine with -Pbenchmark.updateBaseline (and say why in the pull request). Figures
# are machine-specific: -Pbenchmark.machine names the machine, and only its own lines are compared.
# They're recorded on the release build (-Pteavm.release, ADR 0025); the lobby's from then
# on are of the whole scene (its floor and signs, built once its chunks have loaded).
# docs/benchmark.md lists the reference machines.
#
# rule.<figure>=<higher|lower is better> <percent> <absolute>

# Frame rate and frame time.
rule.fpsMedian=higher 5 1
rule.fpsLow1=higher 15 3
rule.frameP99Millis=lower 15 2
# Where the frame's time goes (milliseconds a frame).
rule.tickMillis=lower 20 0.5
rule.extractMillis=lower 20 0.5
rule.renderMillis=lower 20 0.5
rule.gpuMillis=lower 20 0.5
# Draw calls: steady for a fixed scene, so tighter.
rule.drawCalls=lower 10 5
rule.terrainDrawCalls=lower 10 3
# Memory, in megabytes, and garbage collection pauses.
rule.heapMaxMB=lower 10 16
rule.nativeMaxMB=lower 10 16
rule.gcMaxPauseMillis=lower 30 4
# Loading (milliseconds from navigation) and the download (bytes, gzip).
rule.coldTitleMillis=lower 20 500
rule.warmTitleMillis=lower 20 500
rule.joinMillis=lower 20 500
rule.rejoinMillis=lower 20 500
rule.gzipBytes=lower 2 10000

